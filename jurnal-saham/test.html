<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Dashboard | GitHub Pages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .iframe-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 220px); 
            min-height: 500px;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans">

    <nav class="bg-white shadow-sm border-b border-slate-200 px-8 py-5">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Live Data Feed</h1>
                <p class="text-sm text-slate-500">Google Sheets Integration</p>
            </div>
            <div class="flex items-center space-x-6">
                <div class="flex items-center">
                    <span class="flex h-2 w-2 rounded-full bg-green-500 mr-2 animate-pulse"></span>
                    <span class="text-sm font-medium text-slate-600">Live View</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <dt class="text-sm font-medium text-slate-500 uppercase">Access Level</dt>
                <dd class="mt-1 text-3xl font-semibold text-slate-900">Read-Only</dd>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <dt class="text-sm font-medium text-slate-500 uppercase">Status</dt>
                <dd class="mt-1 text-3xl font-semibold text-blue-600">Public</dd>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <dt class="text-sm font-medium text-slate-500 uppercase">Updates</dt>
                <dd class="mt-1 text-3xl font-semibold text-slate-900">Automatic</dd>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            <div class="bg-slate-50 px-6 py-3 border-b border-slate-200 flex justify-between items-center">
                <span class="text-xs font-mono text-slate-500 uppercase tracking-widest text-[10px]">Data Source: Google Sheets</span>
                <span class="text-xs text-slate-400 italic">Syncing live data...</span>
            </div>
            <div class="iframe-container">
                <iframe 
                    src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRX3ByWvCma7lQ4aPVJHzj4HN9z6ye28w_4zgLxsGdZcrUd9GRAWH0PBw5cukWf0pZRraF6-mGRsI0l/pubhtml?widget=true&amp;headers=false&amp;chrome=false">
                </iframe>
            </div>
        </div>
    </main>

</body>
</html>
