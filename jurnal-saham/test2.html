<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="10"> 
    <title>Real-Time Data Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .iframe-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 220px); 
            min-height: 550px;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <nav class="bg-white shadow-sm border-b border-slate-200 px-8 py-5">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight text-indigo-600">Live Workspace</h1>
                <p class="text-xs text-slate-500 font-medium">REAL-TIME SYNC ENABLED</p>
            </div>
            <div class="flex items-center space-x-4">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <span class="text-sm font-bold text-slate-700 uppercase tracking-wider">Live</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <dt class="text-xs font-bold text-slate-400 uppercase">Connection</dt>
                <dd class="mt-1 text-2xl font-bold text-slate-800">Direct Preview</dd>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 border-l-4 border-l-indigo-500">
                <dt class="text-xs font-bold text-slate-400 uppercase">Update Frequency</dt>
                <dd class="mt-1 text-2xl font-bold text-indigo-600 font-mono">Instant</dd>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <dt class="text-xs font-bold text-slate-400 uppercase">Page Refresh</dt>
                <dd class="mt-1 text-2xl font-bold text-slate-800">60 Seconds</dd>
            </div>
        </div>

        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden">
            <div class="bg-slate-800 px-6 py-3 flex justify-between items-center">
                <div class="flex space-x-2">
                    <div class="w-3 h-3 rounded-full bg-red-400"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                    <div class="w-3 h-3 rounded-full bg-green-400"></div>
                </div>
                <span class="text-[10px] font-mono text-slate-400 uppercase tracking-widest">data_stream_active</span>
            </div>
            <div class="iframe-container">
                <iframe 
                    src="https://docs.google.com/spreadsheets/d/1I3nfBEdzm7LKN3lFgc4WkZ5NGrjZtZ1QbN2mWkBO7IE/preview?rm=minimal&gid=74212632">
                </iframe>
            </div>
        </div>
    </main>

</body>
</html>
